[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-shield"
version = "1.0.0"
description = "Security gateway for AI agents: prompt-injection defence, data-leak prevention, tool-call authorisation and a tamper-evident audit log"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_shield = ["default_policy.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=agent_shield --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["src/agent_shield/main.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"src/agent_shield/demo.py" = ["S105", "E501"]
"src/agent_shield/injection.py" = ["E501"]
